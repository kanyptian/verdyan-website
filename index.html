<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verdyan Group</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
    }

    .gateway {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      overflow: hidden;
    }

    /* ========================================
       LEFT SIDE — GRC
       ======================================== */

    .panel-left {
      width: 50%;
      height: 100%;

      background: #f4f2ed;
      color: #151515;

      display: flex;
      align-items: center;
      justify-content: center;

      transform: translateX(-100%);

      animation:
        slideLeft 1.4s cubic-bezier(.77, 0, .18, 1)
        forwards;

      cursor: pointer;

      transition:
        filter .45s ease;
    }

    /* ========================================
       RIGHT SIDE — SECURE ROOMS
       ======================================== */

    .panel-right {
      width: 50%;
      height: 100%;

      background: #111;
      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      transform: translateX(100%);

      animation:
        slideRight 1.4s cubic-bezier(.77, 0, .18, 1)
        forwards;

      cursor: pointer;

      transition:
        filter .45s ease;
    }

    /* ========================================
       TEXT
       ======================================== */

    .choice {
      opacity: 0;

      text-align: center;

      animation:
        revealChoice .8s ease forwards;

      animation-delay: 2.2s;

      transition:
        transform .35s ease;
    }

    .choice h1 {
      font-size: clamp(2.5rem, 5vw, 5.5rem);

      font-weight: 500;

      letter-spacing: .08em;
    }
    .right .choice  {
      padding-left: 110px;
    }

    .choice p {
      margin-top: 18px;

      font-size: clamp(.65rem, 1vw, .9rem);

      letter-spacing: .25em;

      text-transform: uppercase;

      opacity: .65;
    }

    /* ========================================
       CENTER VERDYAN "LOCK"
       ======================================== */

    .lock {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);
        

      width: clamp(180px, 18vw, 280px);
      height: clamp(180px, 18vw, 280px);

      border-radius: 0;

      background: transparent;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 10;

      opacity: 0;

      box-shadow:
        0 0 0 1px rgba(0, 0, 0, .08),
        0 15px 40px rgba(0, 0, 0, .22);

      animation:
        lockReveal .7s ease forwards;

      animation-delay: 1.45s;
    }

    .lock img {
      width: 76%;
      height: auto;

      display: block;

      object-fit: contain;
    }

    /* ========================================
       CENTER SEAM
       ======================================== */

    .seam {
      position: absolute;

      left: 50%;
      top: 0;

      width: 1px;
      height: 100%;

      background:
        rgba(255, 255, 255, .14);

      z-index: 4;

      pointer-events: none;
    }

    /* ========================================
       HOVER EFFECTS
       ======================================== */

    .panel-left:hover {
      filter: brightness(1.035);
    }

    .panel-right:hover {
      filter: brightness(1.18);
    }

    .panel-left:hover .choice,
    .panel-right:hover .choice {
      transform: scale(1.045);
    }

    /* ========================================
       ENTRANCE ANIMATIONS
       ======================================== */

    @keyframes slideLeft {

      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(0);
      }
    }

    @keyframes slideRight {

      from {
        transform: translateX(100%);
      }

      to {
        transform: translateX(0);
      }
    }

    /* Logo arrives AFTER the two halves meet */

    @keyframes lockReveal {

      0% {
        opacity: 0;

        transform:
          translate(-50%, -50%)
          scale(.55);
      }

      65% {
        opacity: 1;

        transform:
          translate(-50%, -50%)
          scale(1.08);
      }

      100% {
        opacity: 1;

        transform:
          translate(-50%, -50%)
          scale(1);
      }
    }

    /* GRC and Secure Rooms appear last */

    @keyframes revealChoice {

      from {
        opacity: 0;

        transform:
          translateY(18px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }

    /* ========================================
       MOBILE
       ======================================== */

    @media (max-width: 700px) {

      .gateway {
        flex-direction: column;
      }

      .panel-left,
      .panel-right {
        width: 100%;
        height: 50%;
      }

      .panel-left {
        transform: translateY(-100%);

        animation:
          slideTop 1.4s
          cubic-bezier(.77, 0, .18, 1)
          forwards;
      }

      .panel-right {
        transform: translateY(100%);

        animation:
          slideBottom 1.4s
          cubic-bezier(.77, 0, .18, 1)
          forwards;
      }

      .lock {
        left: 50%;
        top: 50%;

        width: 125px;
        height: 125px;
      }

      .seam {
        left: 0;
        top: 50%;

        width: 100%;
        height: 1px;
      }

      .choice h1 {
        font-size: clamp(2rem, 10vw, 4rem);
      }

      @keyframes slideTop {

        from {
          transform: translateY(-100%);
        }

        to {
          transform: translateY(0);
        }
      }

      @keyframes slideBottom {

        from {
          transform: translateY(100%);
        }

        to {
          transform: translateY(0);
        }
      }
    }

    /* ========================================
       REDUCED MOTION ACCESSIBILITY
       ======================================== */

    @media (prefers-reduced-motion: reduce) {

      .panel-left,
      .panel-right,
      .lock,
      .choice {
        animation: none;

        transform: none;

        opacity: 1;
      }

      .lock {
        transform:
          translate(-50%, -50%);
      }
    }

  </style>
</head>


<body>

  <main class="gateway">

    <!-- LEFT: GRC -->

    <section
      class="panel-left"
      role="link"
      tabindex="0"
      aria-label="Enter Verdyan GRC"
      onclick="window.location.href='grc.html'"
      onkeydown="
        if(event.key === 'Enter' || event.key === ' ') {
          window.location.href='grc.html';
        }
      "
    >

      <div class="choice">

        <h1>GRC</h1>

        <p>
          Governance • Risk • Compliance
        </p>

      </div>

    </section>


    <!-- RIGHT: SECURE ROOMS -->

    <section
      class="panel-right"
      role="link"
      tabindex="0"
      aria-label="Enter Verdyan Secure Rooms"
      onclick="
        window.location.href='secure-rooms.html'
      "
      onkeydown="
        if(event.key === 'Enter' || event.key === ' ') {
          window.location.href='secure-rooms.html';
        }
      "
    >

      <div class="choice">

        <h1>SECURE ROOMS</h1>

        <p>
          Enter Secure Rooms
        </p>

      </div>

    </section>


    <!-- CENTER SEAM -->

    <div class="seam"></div>


    <!-- ONE CENTRAL VERDYAN LOGO -->

    <div class="lock">

      <img
        src="Verdyan 2000.png"
        alt="Verdyan Group"
      >

    </div>

  </main>

</body>
</html>
